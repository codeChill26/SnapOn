version: '3.8'
services:
  postgres:
    image: postgres:16-alpine
    container_name: snapon-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: snapon
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/createdb.txt:/docker-entrypoint-initdb.d/init.sql

volumes:
  pgdata:
